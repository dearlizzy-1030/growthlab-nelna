</style></head><body><h1>낼나 광고 소재 컨택트시트</h1><p>피드 4:5 · 스토리 9:16 · 문구 상세는 AD-BRIEF.md</p><section><h2>낼나 포커스 온 타이머 <small>32,900원</small></h2><div class="g"><figure><img loading="lazy" src="out/01-timer_c1_feed.png"><figcaption><b>나의 하루는 72시간</b><br>슬로건 브랜딩 · 컬러별 슬로건 3종을 캐러셀로 확장 가능</figcaption></figure><figure><img loading="lazy" src="out/01-timer_c2_feed.png"><figcaption><b>충전 걱정 없이 6개월</b><br>기능 소구(배터리) · 각주 필수</figcaption></figure><figure><img loading="lazy" src="out/01-timer_c3_feed.png"><figcaption><b>내 성향대로 고르는 알람</b><br>성향 맞춤 · 공부/회의/휴식/SNS 시간 제한 다용도로 확장</figcaption></figure><figure><img loading="lazy" src="out/01-timer_t1_feed.png"><figcaption><b>사진 합성 t1</b><br>나의 하루는 72시간</figcaption></figure><figure><img loading="lazy" src="out/01-timer_t2_feed.png"><figcaption><b>사진 합성 t2</b><br>집중할 땐 조용히, 쉴 땐 당당하게</figcaption></figure><figure><img loading="lazy" src="out/01-timer_t3_feed.png"><figcaption><b>사진 합성 t3</b><br>데스크 위 작은 몰입 스위치</figcaption></figure><figure><img loading="lazy" src="out/01-timer_t4_feed.png"><figcaption><b>사진 합성 t4</b><br>나의 하루는 72시간</figcaption></figure><figure class="s"><img loading="lazy" src="out/01-timer_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>낼나 무궁무진 거치대 <small>109,000원</small></h2><div class="g"><figure><img loading="lazy" src="out/02-stand_c1_feed.png"><figcaption><b>거치대, 이제 하나만</b><br>문제 공감(여러 개 사는 불편) → 올인원 해결</figcaption></figure><figure><img loading="lazy" src="out/02-stand_c2_feed.png"><figcaption><b>접으면 4.6mm</b><br>휴대성 수치 소구 · 비교 모델 표기 확인 필요</figcaption></figure><figure><img loading="lazy" src="out/02-stand_c3_feed.png"><figcaption><b>집에서 카페로, 가방 속 작업실</b><br>라이프스타일 · 4단계 각도</figcaption></figure><figure><img loading="lazy" src="out/02-stand_p1_feed.png"><figcaption><b>사진 합성 p1</b><br>집에서 카페로, 가방 속 작업 공간</figcaption></figure><figure><img loading="lazy" src="out/02-stand_p2_feed.png"><figcaption><b>사진 합성 p2</b><br>책 읽을 때도, 태블릿 쓸 때도, 노트북으로 일할 때도. 매번 다른 거치대가 필요했나요?</figcaption></figure><figure class="s"><img loading="lazy" src="out/02-stand_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>낼나 펜슬 아이패드용 <small>82,900원</small></h2><div class="g"><figure><img loading="lazy" src="out/03-pencil_c1_feed.png"><figcaption><b>연필 감성 10,000% 아이패드 펜슬</b><br>감성 훅(소리) · 디자인 차별화</figcaption></figure><figure><img loading="lazy" src="out/03-pencil_c2_feed.png"><figcaption><b>레드닷 수상, 3g 더 가벼운 펜슬</b><br>신뢰(수상) + 스펙 비교 · 근거 보관 필요</figcaption></figure><figure><img loading="lazy" src="out/03-pencil_c3_feed.png"><figcaption><b>1초 만에 깨어나는 펜슬</b><br>기능 소구 · 시험 근거 확인 필요</figcaption></figure><figure><img loading="lazy" src="out/03-pencil_p1_feed.png"><figcaption><b>사진 합성 p1</b><br>사각사각 소리가 들리는 것 같지 않나요?</figcaption></figure><figure><img loading="lazy" src="out/03-pencil_p2_feed.png"><figcaption><b>사진 합성 p2</b><br>10만 번 눌러도 끄떡없는 물리 버튼</figcaption></figure><figure class="s"><img loading="lazy" src="out/03-pencil_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>낼나 스크런치 케이블 세트 <small>38,900원</small></h2><div class="g"><figure><img loading="lazy" src="out/04-scrunchie_c1_feed.png"><figcaption><b>스트랩 하나로 끝</b><br>문제 공감(2가지 사고) → 1개로 해결</figcaption></figure><figure><img loading="lazy" src="out/04-scrunchie_c2_feed.png"><figcaption><b>케이블이 숨어있는 폰스트랩</b><br>디자인 소구</figcaption></figure><figure><img loading="lazy" src="out/04-scrunchie_c3_feed.png"><figcaption><b>60W 고속충전 폰스트랩</b><br>스펙 소구 · 각주 필수</figcaption></figure><figure><img loading="lazy" src="out/04-scrunchie_p1_feed.png"><figcaption><b>사진 합성 p1</b><br>또 떨어뜨렸어요. 또 충전선 놓고 나왔어요. 스트랩 하나로 끝</figcaption></figure><figure><img loading="lazy" src="out/04-scrunchie_p2_feed.png"><figcaption><b>사진 합성 p2</b><br>예쁘면서 충전까지 되는 폰 스트랩</figcaption></figure><figure class="s"><img loading="lazy" src="out/04-scrunchie_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>낼나 나다운 연력 2027 <small>19,500원</small></h2><div class="g"><figure><img loading="lazy" src="out/05-yeonryeok_c1_feed.png"><figcaption><b>1년이 한 장에, 항상 눈앞에</b><br>제품 컨셉 직관 전달</figcaption></figure><figure><img loading="lazy" src="out/05-yeonryeok_c2_feed.png"><figcaption><b>찍기만 해도 기록이에요</b><br>부담 없는 기록 톤 · 다이어리 포기 경험 공감</figcaption></figure><figure><img loading="lazy" src="out/05-yeonryeok_c3_feed.png"><figcaption><b>나다운 1년이 한눈에</b><br>연말 회고 영상/게시물용</figcaption></figure><figure><img loading="lazy" src="out/05-yeonryeok_p1_feed.png"><figcaption><b>사진 합성 p1</b><br>1년이 한 장에, 항상 눈앞에</figcaption></figure><figure><img loading="lazy" src="out/05-yeonryeok_p2_feed.png"><figcaption><b>사진 합성 p2</b><br>쓰기 귀찮은 날엔 콕, 찍기만 하세요. 그것도 기록이에요</figcaption></figure><figure class="s"><img loading="lazy" src="out/05-yeonryeok_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>낼나 2027 그랩&amp;스크랩 박스 <small>34,500원</small></h2><div class="g"><figure><img loading="lazy" src="out/06-grabscrap_c1_feed.png"><figcaption><b>올해의 끝, 내년의 시작</b><br>연말 감성 · 선물 소구</figcaption></figure><figure><img loading="lazy" src="out/06-grabscrap_c2_feed.png"><figcaption><b>나에게 보내는 타임캡슐 액자</b><br>경험 소구(개봉) · 반응 높을 훅</figcaption></figure><figure><img loading="lazy" src="out/06-grabscrap_c3_feed.png"><figcaption><b>추억이 벽 위 인테리어가 됩니다</b><br>인테리어 소구</figcaption></figure><figure><img loading="lazy" src="out/06-grabscrap_p1_feed.png"><figcaption><b>사진 합성 p1</b><br>올해의 끝을 붙잡고, 내년을 차곡차곡 쌓아가요</figcaption></figure><figure><img loading="lazy" src="out/06-grabscrap_p2_feed.png"><figcaption><b>사진 합성 p2</b><br>다짐은 봉인하고, 1년 뒤 연말에 열어보세요</figcaption></figure><figure class="s"><img loading="lazy" src="out/06-grabscrap_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>낼나 플레이온 키링 어댑터 <small>23,200원</small></h2><div class="g"><figure><img loading="lazy" src="out/07-playon_c1_feed.png"><figcaption><b>이거, 사실 충전기예요</b><br>반전 훅 · 소재 임팩트 최상 (우선 테스트)</figcaption></figure><figure><img loading="lazy" src="out/07-playon_c2_feed.png"><figcaption><b>충전기를 키링처럼</b><br>발상 전환</figcaption></figure><figure><img loading="lazy" src="out/07-playon_c3_feed.png"><figcaption><b>88g, 가방에 걸어두는 충전기</b><br>무게 소구 + 안전성 신뢰</figcaption></figure><figure><img loading="lazy" src="out/07-playon_p1_feed.png"><figcaption><b>사진 합성 p1</b><br>귀여운 MP3 플레이어인 줄 알았죠? 사실은 30W 충전기예요</figcaption></figure><figure><img loading="lazy" src="out/07-playon_p2_feed.png"><figcaption><b>사진 합성 p2</b><br>충전기는 왜 항상 가방 속에 있어야 할까요?</figcaption></figure><figure class="s"><img loading="lazy" src="out/07-playon_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section><section><h2>2027 낼나다이어리 <small>에센셜 16,900원 · 시그니처 19,900원</small></h2><div class="g"><figure><img loading="lazy" src="out/08-diary_c1_feed.png"><figcaption><b>계획은 늘 바뀌어요, 괜찮아요</b><br>수정 스트레스 공감 훅 (우선 테스트)</figcaption></figure><figure><img loading="lazy" src="out/08-diary_c2_feed.png"><figcaption><b>일정 아이콘 한 번이면</b><br>직장인 타깃 · 기능 소구 · 정확한 표현 필수</figcaption></figure><figure><img loading="lazy" src="out/08-diary_c3_feed.png"><figcaption><b>11월에 사도 15개월</b><br>시즌 타깃팅 (지금 구매 이유)</figcaption></figure><figure><img loading="lazy" src="out/08-diary_c4_feed.png"><figcaption><b>3개월마다 다시 시작해요</b><br>작심삼일 공감 · 버전 가격 병기</figcaption></figure><figure class="s"><img loading="lazy" src="out/08-diary_c1_story.png"><figcaption>스토리/릴스 커버 (c1)</figcaption></figure></div></section></body></html>
